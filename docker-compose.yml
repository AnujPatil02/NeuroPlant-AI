services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: neuroplant-mqtt
    ports:
      - "1884:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: neuroplant-influxdb
    ports:
      - "8087:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin12345
      - DOCKER_INFLUXDB_INIT_ORG=neuroplant_org
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=neuroplant_dev_token_12345
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neuroplant-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: neuroplant-postgres
    ports:
      - "5444:5432"
    environment:
      - POSTGRES_DB=neuroplant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=anujsp1725
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: neuroplant-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./src/layer2_monitoring/grafana_provisioning:/etc/grafana/provisioning
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: neuroplant-mlflow
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow==2.19.0 -q &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri sqlite:////mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: neuroplant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

volumes:
  influxdb_data:
  postgres_data:
  mlflow_data:
