services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: neuroplant-mqtt
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: neuroplant-influxdb
    ports:
      - "127.0.0.1:8087:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?Set INFLUXDB_ADMIN_PASSWORD in .env}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-neuroplant_org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-sensor_data}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neuroplant-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: neuroplant-postgres
    ports:
      - "127.0.0.1:5444:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-neuroplant}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: neuroplant-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Lets the provisioned datasource use $INFLUXDB_TOKEN instead of a hardcoded token
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
    volumes:
      - ./src/layer2_monitoring/grafana_provisioning:/etc/grafana/provisioning
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: neuroplant-mlflow
    ports:
      - "127.0.0.1:5000:5000"
    command: >
      bash -c "pip install mlflow==2.19.0 -q &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri sqlite:////mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: neuroplant-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

volumes:
  influxdb_data:
  postgres_data:
  mlflow_data: