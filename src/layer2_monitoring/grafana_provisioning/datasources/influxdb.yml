apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: neuroplant_org
      defaultBucket: sensor_data
      tlsSkipVerify: true
    secureJsonData:
      token: neuroplant_dev_token_12345
    isDefault: true